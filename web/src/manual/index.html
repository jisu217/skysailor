<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O4 · MANUAL 조종</title>
<style>body{margin:0;background:#101e27;color:#dfedef;font:15px system-ui}header{padding:18px 24px;background:#192c37}a{color:#8fdec6}main{display:grid;grid-template-columns:minmax(400px,1fr) 330px;gap:20px;padding:20px}canvas{width:100%;height:560px;background:#142630;border-radius:12px;touch-action:none}aside{background:#1b303b;padding:18px;border-radius:12px}button,input,select{font:inherit;padding:8px;border-radius:6px;border:1px solid #49636d}button{background:#b5eadb;color:#132a2c;cursor:pointer}button:disabled{opacity:.4}label{display:block;margin:10px 0}input[type=number]{width:80px}input[type=range]{width:90%}#pad{width:210px;height:210px;position:relative;background:#284853;border:1px solid #72bda8;margin:12px auto;touch-action:none;cursor:crosshair}#pad:before,#pad:after{content:'';position:absolute;background:#638089}#pad:before{width:1px;height:100%;left:50%}#pad:after{height:1px;width:100%;top:50%}#dot{position:absolute;width:12px;height:12px;background:#ffe398;border-radius:50%;left:99px;top:99px}small{color:#a7bbc4}#status{white-space:pre-wrap;padding:12px;min-height:40px}#stats{font:16px monospace;padding:12px}fieldset{border:1px solid #42606b} @media(max-width:850px){main{grid-template-columns:1fr}canvas{height:380px}}#pad{background:transparent;border:0}#pad:before,#pad:after{display:none}#pad svg{width:100%;height:100%;pointer-events:none}#pad[hidden]{display:none}</style>
<header><b>O4 · MANUAL 조종</b>　<a href="/arena/">리더보드 ↗</a> <small>일시정지·단계 진행 가능 / 입력을 서버에서 재현하여 평가</small></header>
<main><section><canvas id="view"></canvas><div id="stats"></div><div><button id="play">▶ 진행</button> <button id="step">한 단계 (D / →)</button> <button id="back">되돌리기 (A / ←)</button><label>진행 간격 <input id="dt" type="number" min="0.02" max="0.5" step="0.02" value="0.1"> 초</label></div><div id="status" role="status"></div><small>3D 화면: 드래그로 시점 회전. 파란 화살표는 바람, 1·2·3은 막대 번호. 패드는 기체 좌표계 +X(오른쪽), +Y(위쪽) 이동 방향입니다.</small></section>
<aside><fieldset id="hw"><legend>기체 설정 (시작 후 고정)</legend><label>추 질량 g <input id="mass" type="number" min="0.1" step="0.01" value="18"></label><label>아래 거리 mm <input id="drop" type="number" min="40" step="0.01" value="60"></label><label>목표 속도 mm/s <input id="speed" type="number" min="5" step="0.01" value="30"></label></fieldset><label>비행 <select id="flight"></select></label><button id="start">이 설정으로 5회 시작</button><button id="edit">기체 설정 변경 / 기록 초기화</button><hr><label>조작 방식 <select id="mode"><option value="pad">추 이동 방향 패드</option><option value="rods">세 막대 직접 조절</option></select></label><div id="pad"><svg viewBox="0 0 210 210" aria-hidden="true"><polygon points="195,105 60,27.06 60,182.94" fill="#284853" stroke="#72bda8" stroke-width="2"/><path d="M105 105L195 105M105 105L60 27.06M105 105L60 182.94" stroke="#638089"/><g fill="#ffe398" font-size="16" font-family="system-ui" text-anchor="middle"><text x="199" y="96">1</text><text x="54" y="21">2</text><text x="54" y="201">3</text></g></svg><span id="dot"></span></div><small>중앙에서 멀수록 빠름 · 누른 채 D로 진행 · 손을 떼면 정지</small><label>추 위/아래 속도 (+ 위)<input aria-label="추 위아래 속도" id="vertical" type="range" min="-1" max="1" step="0.05" value="0"></label><div id="rods" hidden></div><button id="zero">모든 입력 0</button><hr><label>참가자 <input id="person" value="cykim"></label><label>기록 이름 <input id="name" value="O4 수동 조종"></label><button id="submit" disabled>5회 기록 제출 · MANUAL</button><p><small>되돌리기 사용 여부를 기록합니다. 기존 기록은 브라우저에 자동 저장됩니다. MANUAL은 새 바람에 대응하는 자동 Agent가 아닙니다.</small></p></aside></main><script src="app.js?v=4"></script></html>
