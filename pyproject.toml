[project]
name = "clover-drop"
version = "0.1.0"
description = "Two-axis cable-controlled clover descent simulation"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=2,<3",
    "matplotlib>=3.9,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "gymnasium>=1.4.0",
]
[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]
[tool.pytest.ini_options]
pythonpath = ["."]
